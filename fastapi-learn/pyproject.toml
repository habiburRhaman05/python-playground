[project]
name = "fastapi-learn"
version = "0.1.0"
description = "FastAPI learning application"
readme = "prd.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]",
    "alembic",
    "psycopg2-binary",  # 👇 ADD THIS DEPENDENCY HERE
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.fastapi]
entrypoint = "main:app"
